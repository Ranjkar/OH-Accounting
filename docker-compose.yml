# DEVELOPMENT compose -- exposes Postgres on the host for local tooling
# (psql, a GUI client), uses the weak postgres/onholland credentials below
# deliberately (this file is for local dev only). For a production-oriented
# deployment use docker-compose.prod.yml instead, which does not expose
# Postgres to the host and takes all credentials from the environment.
#
# Local dev normally runs Postgres via Homebrew + the backend/frontend
# directly (see README) -- this is for anyone who prefers containers.
# Secrets come from backend/.env (gitignored, never committed) via env_file,
# never hardcoded here except the dev-only Postgres password. The named
# volume is never removed by `docker compose up` -- only an explicit
# `docker compose down -v` would drop it, and that should never be run
# against a real environment's data.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onholland
      POSTGRES_PASSWORD: onholland
      POSTGRES_DB: onholland_accounting
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onholland"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://onholland:onholland@postgres:5432/onholland_accounting
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
